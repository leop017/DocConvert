[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docconvert-local"
version = "2.0.3"
description = "Clean Excel & Word → Markdown for RAG pipelines. Works 100% offline — no API keys, no cloud upload."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["document", "conversion", "excel", "word", "markdown"]
authors = [
    { name = "DocConvert Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "mammoth>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "xlrd>=2.0.0",
]

[project.optional-dependencies]
test = ["mypy>=1.0", "xlwt"]
doc = ["textract>=1.6.0; platform_system != 'Windows'"]
build = ["pyinstaller>=6.0"]
all = ["docconvert-local[test,doc,build]"]

[project.urls]
Homepage = "https://github.com/leop017/DocConvert"
BugTracker = "https://github.com/leop017/DocConvert/issues"

[project.scripts]
docconvert = "docconvert.cli:main_cli"

[tool.setuptools.packages.find]
include = ["docconvert", "docconvert.*"]

[tool.setuptools.package-data]
docconvert = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "dist",
    "build",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Conservative starting set: errors, warnings, pyflakes, isort, pyupgrade.
# Extend incrementally after the existing codebase is cleaned up.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long — formatter is the source of truth, not the linter
    "UP045",  # non-pep604-annotation-optional — `Optional[X]` style is widely used; do not force rewrite
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",   # module-level import not at top of file — test setup can require this
    "F401",   # imported but unused — tests often import helpers to assert side effects
    "F841",   # local variable assigned but never used — debug fixtures
]

[tool.ruff.lint.isort]
known-first-party = ["docconvert", "tests"]
combine-as-imports = true
