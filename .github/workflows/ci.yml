name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run tests
        shell: bash
        run: |
          mkdir -p ci-artifacts
          python --version 2>&1 | tee ci-artifacts/python-version.txt
          pip list 2>/dev/null | tee ci-artifacts/pip-list.txt || true
          echo "===== unittest =====" | tee ci-artifacts/unittest.log
          python -m unittest discover -s tests -v 2>&1 | tee -a ci-artifacts/unittest.log
          rc=${PIPESTATUS[0]}
          echo "===== exit=$rc =====" | tee -a ci-artifacts/unittest.log
          exit $rc

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: ci-artifacts/
          if-no-files-found: ignore