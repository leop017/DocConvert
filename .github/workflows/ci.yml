name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Install test dependencies
        shell: bash
        run: |
          # xlwt: required by TestExcelConverterXlsCache to generate .xls fixtures
          # textract: required by TestDocConverterJsonFormat; only install on Linux
          pip install xlwt
          if [ "$RUNNER_OS" != "Windows" ]; then
            pip install "textract>=1.6.0"
          fi

      - name: Install Xvfb for GUI tests (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests
        shell: bash
        run: |
          mkdir -p ci-artifacts
          python --version 2>&1 | tee ci-artifacts/python-version.txt
          pip list 2>/dev/null | tee ci-artifacts/pip-list.txt || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "===== Running under xvfb =====" | tee ci-artifacts/unittest.log
            xvfb-run -a python -m unittest discover -s tests -v 2>&1 | tee -a ci-artifacts/unittest.log
          else
            echo "===== Running tests =====" | tee ci-artifacts/unittest.log
            python -m unittest discover -s tests -v 2>&1 | tee -a ci-artifacts/unittest.log
          fi
          rc=${PIPESTATUS[0]}
          echo "===== exit=$rc =====" | tee -a ci-artifacts/unittest.log
          exit $rc

      - name: Run mypy type check
        shell: bash
        run: |
          pip install mypy
          mypy docconvert/ --ignore-missing-imports

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: ci-artifacts/
          if-no-files-found: ignore