name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run tests
        shell: bash
        run: |
          set +e
          python --version
          pip list 2>/dev/null | head -n 40
          echo "===== unittest ====="
          python -m unittest discover -s tests -v 2>&1 | tail -n 200
          rc=${PIPESTATUS[0]}
          echo "===== unittest exit=$rc ====="
          exit $rc