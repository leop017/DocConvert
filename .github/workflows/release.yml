name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. v2.0.0) to rebuild; leave empty to draft a release from main.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,build]"

      - name: Build executable
        run: python build_scripts/build_exe.py --clean

      - name: Stage artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artefacts
          if [ -d "dist/DocConvert-${{ runner.os }}-${{ runner.arch }}" ]; then
            # bundled onedir build
            7z a -tzip "release-artefacts/DocConvert-${{ runner.os }}-${{ runner.arch }}.zip" \
              "dist/DocConvert-${{ runner.os }}-${{ runner.arch }}" >/dev/null
          else
            # single-file build
            cp "dist/DocConvert-${{ runner.os }}-${{ runner.arch }}/"* release-artefacts/
          fi
          ls -la release-artefacts

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: DocConvert-${{ runner.os }}
          path: release-artefacts/

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: ${{ steps.tag.outputs.tag }}"

      - name: Download all platform artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DocConvert ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artefacts/**
