name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. v2.0.0) to rebuild; leave empty to draft a release from main.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ".[build]"

      - name: Build executable
        run: python build_scripts/build_exe.py --clean

      - name: Stage artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artefacts
          artefact_dir="$(ls -1 -d dist/DocConvert-* 2>/dev/null | head -n1 || true)"
          if [ -z "${artefact_dir:-}" ]; then
            echo "No artefact directory found under dist/" >&2
            exit 1
          fi
          archive_name="DocConvert-$(echo "${artefact_dir}" | sed 's|dist/||').zip"
          7z a -tzip "release-artefacts/${archive_name}" "${artefact_dir}" >/dev/null
          ls -la release-artefacts

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: DocConvert-${{ runner.os }}
          path: release-artefacts/

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: ${{ steps.tag.outputs.tag }}"

      - name: Download all platform artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Generate release body from CHANGELOG
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BODY=$(awk -v tag="$TAG" '
            /^## \[/'"$TAG"'\]/ {found=1; next}
            /^## \[/ {found=0}
            found {print}
          ' CHANGELOG.md)
          # Add full changelog link
          BODY="${BODY}

---

**Full Changelog**: https://github.com/leop017/DocConvert/compare/${TAG}...HEAD"
          printf '%s' "$BODY" > "$GITHUB_OUTPUT"
          echo "Release body generated (length: ${#BODY})"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DocConvert ${{ steps.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artefacts/**

  pypi-publish:
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "Publishing version: $VERSION"
          VERSION="$VERSION" python -c "import os,re; p='pyproject.toml'; s=open(p).read(); v=os.environ['VERSION']; s=re.sub(r'^version = \".*\"', f'version = \"{v}\"', s, count=1, flags=re.M); open(p,'w').write(s); print('Updated',p,'-> version =',v)"

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --username __token__ --password "$PYPI_TOKEN" dist/*
